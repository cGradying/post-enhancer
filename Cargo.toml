[package]
name = "photo-post-prep"
version = "2.0.0"
edition = "2024"

[dependencies]
aws-config = "1.13.0"
aws-sdk-s3 = "1.155.0"
axum = { version = "0.8", features = ["multipart"] }
fast_image_resize = { version = "6.1.0", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
jpeg-encoder = "0.7.1"
png = "0.18.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "limit"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
